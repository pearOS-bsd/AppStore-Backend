<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pearOS App Store</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">🍐 App Store</a>
    <a class="btn" href="https://github.com/pearOS-bsd/AppStore-Backend/issues/new?template=submit-app.yml" target="_blank" rel="noopener">Submit an App</a>
  </header>

  <main>
    <input class="search" id="search" type="search" placeholder="Search apps" />
    <div class="categories" id="categories"></div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">No apps published yet — be the first to submit one.</div>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
