name: Test C1v2
description: diagnostic
title: '[TestC1v2] '
body:
- type: input
  id: currency
  attributes:
    label: Currency
    value: USD
  validations:
    required: true
- type: dropdown
  id: iap_available
  attributes:
    label: In-App Purchases Available?
    options:
    - 'Yes'
    - 'No'
  validations:
    required: true
- type: textarea
  id: iap_list
  attributes:
    label: In-App Purchases List
    description: 'One per line, format: id|name|price|type'
    placeholder: 'iap_pro_yearly|Pro Yearly|99.99|Auto-Renewable Subscription

      '
  validations:
    required: false
- type: input
  id: version
  attributes:
    label: Version
    placeholder: 1.0.0
  validations:
    required: true
- type: input
  id: build_number
  attributes:
    label: Build Number
    placeholder: '24021200'
  validations:
    required: true
- type: input
  id: download_size_formatted
  attributes:
    label: Download Size (formatted)
    placeholder: 1.2 GB
  validations:
    required: true
- type: input
  id: download_size_bytes
  attributes:
    label: Download Size (bytes)
    placeholder: '1288490188'
  validations:
    required: true
- type: input
  id: binary_type
  attributes:
    label: Binary Type
    value: pearOS Universal Binary
  validations:
    required: true
