name: Test UpAccept
description: diagnostic
title: '[TestUpAccept] '
body:
- type: upload
  id: asset_upload
  attributes:
    label: App Assets
    description: 'GitHub only allows ONE upload field per form, so everything goes
      here. Drop files in this exact order: 1) your build (.pkg or .app.zip), 2) your
      app icon image, 3) one or more screenshot images. Nothing here is ever linked
      from an external site, so it can''t be swapped out after review.'
  validations:
    required: true
    accept: .pkg,.zip,.png,.jpg,.jpeg
