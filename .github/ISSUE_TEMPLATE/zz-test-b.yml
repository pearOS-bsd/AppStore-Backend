name: Test UpB
description: diagnostic
title: '[TestUpB] '
body:
- type: dropdown
  id: is_free
  attributes:
    label: Is the app free?
    options:
    - 'Yes'
    - 'No'
  validations:
    required: true
- type: input
  id: price
  attributes:
    label: Price (0.00 if free)
    placeholder: '0.00'
    value: '0.00'
  validations:
    required: true
- type: input
  id: currency
  attributes:
    label: Currency
    value: USD
  validations:
    required: true
- type: dropdown
  id: iap_available
  attributes:
    label: In-App Purchases Available?
    options:
    - 'Yes'
    - 'No'
  validations:
    required: true
- type: textarea
  id: iap_list
  attributes:
    label: In-App Purchases List
    description: 'One per line, format: id|name|price|type'
    placeholder: 'iap_pro_yearly|Pro Yearly|99.99|Auto-Renewable Subscription

      '
  validations:
    required: false
- type: input
  id: version
  attributes:
    label: Version
    placeholder: 1.0.0
  validations:
    required: true
- type: input
  id: build_number
  attributes:
    label: Build Number
    placeholder: '24021200'
  validations:
    required: true
- type: input
  id: download_size_formatted
  attributes:
    label: Download Size (formatted)
    placeholder: 1.2 GB
  validations:
    required: true
- type: input
  id: download_size_bytes
  attributes:
    label: Download Size (bytes)
    placeholder: '1288490188'
  validations:
    required: true
- type: input
  id: binary_type
  attributes:
    label: Binary Type
    value: pearOS Universal Binary
  validations:
    required: true
- type: textarea
  id: supported_device_models
  attributes:
    label: Supported pearOS Device Models
    description: One model identifier per line.
    placeholder: 'PearBookAir10,1

      PearStudio1,1

      '
  validations:
    required: false
- type: input
  id: subtitle
  attributes:
    label: Subtitle
    placeholder: Word processor for pearOS
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Description
  validations:
    required: true
- type: textarea
  id: whats_new
  attributes:
    label: What's New
  validations:
    required: true
- type: input
  id: privacy_policy_url
  attributes:
    label: Privacy Policy URL
  validations:
    required: true
- type: textarea
  id: data_types_collected
  attributes:
    label: Data Types Collected
    description: 'One per line, format: Purpose: DataType1, DataType2'
    placeholder: 'Analytics: Usage Data, Diagnostics

      '
  validations:
    required: false
- type: upload
  id: asset_upload
  attributes:
    label: App Assets
    description: 'GitHub only allows ONE upload field per form, so everything goes
      here. Drop files in this exact order: 1) your build (.pkg or .app.zip), 2) your
      app icon image, 3) one or more screenshot images. Nothing here is ever linked
      from an external site, so it can''t be swapped out after review.'
  validations:
    required: true
    accept: .pkg,.zip,.png,.jpg,.jpeg
