name: Test C2v2
description: diagnostic
title: '[TestC2v2] '
body:
- type: textarea
  id: supported_device_models
  attributes:
    label: Supported pearOS Device Models
    description: One model identifier per line.
    placeholder: 'PearBookAir10,1

      PearStudio1,1

      '
  validations:
    required: false
- type: upload
  id: build_upload
  attributes:
    label: Build File (.pkg or .app.zip)
    description: Drag and drop your installer or app bundle archive here. The maintainer
      downloads it from this issue during review — it is not published on the public
      site.
  validations:
    required: true
    accept: .pkg,.zip
- type: input
  id: subtitle
  attributes:
    label: Subtitle
    placeholder: Word processor for pearOS
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Description
  validations:
    required: true
- type: textarea
  id: whats_new
  attributes:
    label: What's New
  validations:
    required: true
- type: input
  id: privacy_policy_url
  attributes:
    label: Privacy Policy URL
  validations:
    required: true
- type: textarea
  id: data_types_collected
  attributes:
    label: Data Types Collected
    description: 'One per line, format: Purpose: DataType1, DataType2'
    placeholder: 'Analytics: Usage Data, Diagnostics

      '
  validations:
    required: false
- type: upload
  id: app_icon_upload
  attributes:
    label: App Icon (1024x1024)
    description: Drag and drop the icon image file. Uploaded directly to this issue
      — we never load images from an external link you control, to keep the store
      safe from assets being swapped out after review.
  validations:
    required: true
    accept: .png,.jpg,.jpeg
- type: upload
  id: screenshots_upload
  attributes:
    label: Screenshots (pearOS)
    description: Drag and drop one or more screenshot image files.
  validations:
    required: true
    accept: .png,.jpg,.jpeg
