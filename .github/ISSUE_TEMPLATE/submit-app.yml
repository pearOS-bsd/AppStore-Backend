name: "📦 Submit an App"
description: Submit a new pearOS app to the pearOS App Store for review.
title: "[App Submission] "
labels: ["app-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## pearOS Developer Console — New App Submission
        Fill in every field as accurately as possible. Once submitted, this issue is picked up automatically
        and a Pull Request is opened for review. Your app goes live only after the PR is approved and merged.

        **About the build file:** attach your `.pkg` / `.app.zip` directly below using GitHub's file upload
        field. The maintainer will pick it up from this issue during review, host a permanent copy as a
        GitHub Release, and attach the final download link before merging.

  - type: input
    id: app_name
    attributes:
      label: App Name
      placeholder: "Microsoft Word"
    validations:
      required: true

  - type: input
    id: bundle_id
    attributes:
      label: Bundle ID
      placeholder: "com.microsoft.Word"
    validations:
      required: true

  - type: input
    id: developer_name
    attributes:
      label: Developer / Company Name
      placeholder: "Microsoft Corporation"
    validations:
      required: true

  - type: input
    id: developer_website
    attributes:
      label: Developer Website
      placeholder: "https://www.microsoft.com"
    validations:
      required: true

  - type: input
    id: support_website
    attributes:
      label: Support Website
      placeholder: "https://support.microsoft.com/word"
    validations:
      required: true

  - type: input
    id: default_language
    attributes:
      label: Default Language
      placeholder: "en-US"
      value: "en-US"
    validations:
      required: true

  - type: dropdown
    id: category_primary
    attributes:
      label: Primary Category
      options:
        - Productivity
        - Business
        - Developer Tools
        - Utilities
        - Graphics & Design
        - Photo & Video
        - Music
        - Games
        - Education
        - Finance
        - Social Networking
        - Health & Fitness
    validations:
      required: true

  - type: dropdown
    id: category_secondary
    attributes:
      label: Secondary Category (optional)
      description: Leave unselected if this app only needs one category.
      options:
        - Productivity
        - Business
        - Developer Tools
        - Utilities
        - Graphics & Design
        - Photo & Video
        - Music
        - Games
        - Education
        - Finance
        - Social Networking
        - Health & Fitness
    validations:
      required: false

  - type: dropdown
    id: content_rating
    attributes:
      label: Content Advisory Rating
      options: ["4+", "9+", "12+", "17+"]
    validations:
      required: true

  - type: input
    id: min_pearos_version
    attributes:
      label: Minimum pearOS Version
      placeholder: "13.0.0"
    validations:
      required: true

  - type: checkboxes
    id: architectures
    attributes:
      label: Supported Architectures
      description: Select at least one. Leaving both unchecked will fail review validation.
      options:
        - label: arm64
        - label: x86_64

  - type: dropdown
    id: universal_binary
    attributes:
      label: Universal Binary?
      options: ["Yes", "No"]
    validations:
      required: true

  - type: dropdown
    id: sandbox_enabled
    attributes:
      label: pearOS App Sandbox Enabled?
      options: ["Yes", "No"]
    validations:
      required: true

  - type: dropdown
    id: hardened_runtime
    attributes:
      label: Hardened Runtime Enabled?
      options: ["Yes", "No"]
    validations:
      required: true

  - type: textarea
    id: entitlements
    attributes:
      label: Entitlements
      description: One entitlement per line.
      placeholder: |
        com.pearos.security.files.user-selected.read-write
        com.pearos.security.network.client
    validations:
      required: false

  - type: dropdown
    id: is_free
    attributes:
      label: Is the app free?
      options: ["Yes", "No"]
    validations:
      required: true

  - type: input
    id: price
    attributes:
      label: Price (0.00 if free)
      placeholder: "0.00"
      value: "0.00"
    validations:
      required: true

  - type: input
    id: currency
    attributes:
      label: Currency
      value: "USD"
    validations:
      required: true

  - type: dropdown
    id: iap_available
    attributes:
      label: In-App Purchases Available?
      options: ["Yes", "No"]
    validations:
      required: true

  - type: textarea
    id: iap_list
    attributes:
      label: In-App Purchases List
      description: 'One per line, format: id|name|price|type'
      placeholder: |
        iap_pro_yearly|Pro Yearly|99.99|Auto-Renewable Subscription
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: build_number
    attributes:
      label: Build Number
      placeholder: "24021200"
    validations:
      required: true

  - type: input
    id: download_size_formatted
    attributes:
      label: Download Size (formatted)
      placeholder: "1.2 GB"
    validations:
      required: true

  - type: input
    id: download_size_bytes
    attributes:
      label: Download Size (bytes)
      placeholder: "1288490188"
    validations:
      required: true

  - type: input
    id: binary_type
    attributes:
      label: Binary Type
      value: "pearOS Universal Binary"
    validations:
      required: true

  - type: textarea
    id: supported_device_models
    attributes:
      label: Supported pearOS Device Models
      description: One model identifier per line.
      placeholder: |
        PearBookAir10,1
        PearStudio1,1
    validations:
      required: false

  - type: upload
    id: build_upload
    attributes:
      label: Build File (.pkg or .app.zip)
      description: >-
        Drag and drop your installer or app bundle archive here. The maintainer downloads it from this
        issue during review — it is not published on the public site.
    validations:
      required: true
      accept: ".pkg,.zip"

  - type: input
    id: subtitle
    attributes:
      label: Subtitle
      placeholder: "Word processor for pearOS"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true

  - type: textarea
    id: whats_new
    attributes:
      label: What's New
    validations:
      required: true

  - type: input
    id: privacy_policy_url
    attributes:
      label: Privacy Policy URL
    validations:
      required: true

  - type: textarea
    id: data_types_collected
    attributes:
      label: Data Types Collected
      description: 'One per line, format: Purpose: DataType1, DataType2'
      placeholder: |
        Analytics: Usage Data, Diagnostics
    validations:
      required: false

  - type: upload
    id: app_icon_upload
    attributes:
      label: App Icon (1024x1024)
      description: >-
        Drag and drop the icon image file. Uploaded directly to this issue — we never
        load images from an external link you control, to keep the store safe from
        assets being swapped out after review.
    validations:
      required: true
      accept: ".png,.jpg,.jpeg"

  - type: upload
    id: screenshots_upload
    attributes:
      label: Screenshots (pearOS)
      description: Drag and drop one or more screenshot image files.
    validations:
      required: true
      accept: ".png,.jpg,.jpeg"
